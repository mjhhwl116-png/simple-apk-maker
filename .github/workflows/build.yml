name: Build Child App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Buildozer Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Prepare and Initialize Buildozer
      run: |
        buildozer init
        sed -i 's/# title = My Application/title = ChildApp/' buildozer.spec
        sed -i 's/# package.name = My App/package.name = childapp/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.ayman/' buildozer.spec
        sed -i 's/# source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,firebase-admin,urllib3,certifi,idna,requests/' buildozer.spec
        sed -i 's/# android.permissions =/android.permissions = INTERNET,CAMERA,ACCESS_FINE_LOCATION,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/' buildozer.spec

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: child-app-apk
        path: bin/*.apk
